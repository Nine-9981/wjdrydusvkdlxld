<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>급식표 데이터 모델링 체험</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f3f4f6;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        input[type="radio"]:checked + div {
            border-color: #4f46e5;
            background-color: #eef2ff;
        }
        input[type="checkbox"]:checked + div {
            border-color: #4f46e5;
            background-color: #eef2ff;
        }
    </style>
</head>
<body class="text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const menuData = [
            { id: 1, name: "백미밥", allergy: "", calories: 310, protein: 6, calcium: 10, origin: "국내산" },
            { id: 2, name: "설렁탕", allergy: "5.6.16", calories: 250, protein: 15, calcium: 150, origin: "쇠고기(국내산)" },
            { id: 3, name: "반반만두찜", allergy: "1.5.6.10.13", calories: 152, protein: 8, calcium: 40, origin: "돼지고기(국내산)" },
            { id: 4, name: "가자미유린기", allergy: "5.6.13", calories: 60, protein: 2, calcium: 10, origin: "가자미(러시아산)" },
            { id: 5, name: "오이다다기무침", allergy: "13", calories: 15, protein: 0, calcium: 10, origin: "국내산" },
            { id: 6, name: "배추김치", allergy: "9.13", calories: 25, protein: 1, calcium: 190, origin: "배추(국내산)" }
        ];

        const attributes = [
            { id: 'menu', label: '메뉴', required: true },
            { id: 'allergy', label: '알레르기 번호', required: false },
            { id: 'calories', label: '열량(kcal)', required: false },
            { id: 'protein', label: '단백질(g)', required: false },
            { id: 'calcium', label: '칼슘(mg)', required: false },
            { id: 'origin', label: '원산지 정보', required: false }
        ];

        const App = () => {
            const [situation, setSituation] = useState(null); // 'allergy' | 'bulkup'
            const [selectedAttrs, setSelectedAttrs] = useState(['menu']);
            const [result, setResult] = useState(null);

            // 속성 선택 토글 함수
            const toggleAttribute = (attrId) => {
                if (attrId === 'menu') return; // 메뉴명은 필수 해제 불가
                setSelectedAttrs(prev => 
                    prev.includes(attrId) ? prev.filter(id => id !== attrId) : [...prev, attrId]
                );
            };

            // 상황 변경 시 결과 초기화
            useEffect(() => {
                setResult(null);
            }, [situation, selectedAttrs]);

            // 모델링 적용 및 피드백 로직
            const applyModeling = () => {
                if (!situation) {
                    alert("먼저 상황을 선택해주세요.");
                    return;
                }

                let feedback = { type: '', title: '', message: '' };
                const hasAllergy = selectedAttrs.includes('allergy');
                const hasCalories = selectedAttrs.includes('calories');
                const hasProtein = selectedAttrs.includes('protein');
                const hasCalcium = selectedAttrs.includes('calcium');
                const hasOrigin = selectedAttrs.includes('origin');

                if (situation === 'allergy') {
                    if (!hasAllergy) {
                        feedback = { type: 'error', title: '핵심 정보 누락', message: '앗! 계란 알레르기가 있는 친구에게 가장 중요한 알레르기 번호가 빠졌어요. 생명과 직결되는 정보이니 꼭 포함해주세요!' };
                    } else if (hasCalories || hasProtein || hasCalcium || hasOrigin) {
                        feedback = { type: 'warning', title: '정보 과잉', message: '알레르기 정보는 잘 골랐어요! 하지만 열량이나 원산지 같은 부가 정보가 섞여 있으면, 직관적으로 위험 메뉴를 파악하기 어려울 수 있어요. 목적에 맞게 꼭 필요한 것만 남겨볼까요?' };
                    } else {
                        feedback = { type: 'success', title: '🎉 모델링 성공!', message: '완벽해요! 불필요한 정보는 과감히 덜어내고, 목적에 딱 맞는 안전한 식단표 데이터 모델을 완성했습니다.' };
                    }
                } else if (situation === 'bulkup') {
                    if (!hasCalories || !hasProtein) {
                        feedback = { type: 'error', title: '핵심 정보 누락', message: '운동을 하는 친구에게 꼭 필요한 영양 정보(열량, 단백질)가 부족합니다. 다시 선택해볼까요?' };
                    } else if (hasAllergy || hasOrigin || hasCalcium) {
                        feedback = { type: 'warning', title: '정보 과잉', message: '열량과 단백질은 잘 챙겼네요! 다만 근성장과 크게 상관없는 알레르기나 원산지 정보가 들어가서 표가 복잡해졌어요. 조금 더 단순화해볼까요?' };
                    } else {
                        feedback = { type: 'success', title: '🎉 모델링 성공!', message: '최고예요! 식단 관리에 필요한 핵심 속성(열량, 단백질)만 추출하여 완벽하게 모델링했습니다.' };
                    }
                }

                setResult({ feedback, attributes: selectedAttrs });
            };

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-6 pb-20">
                    <header className="mb-8 border-b-2 border-slate-300 pb-4">
                        <h1 className="text-2xl md:text-3xl font-bold text-slate-800 mb-2">🍱 오늘의 급식 (11월 5일)</h1>
                        <p className="text-sm md:text-base text-slate-600">원본 데이터를 확인하고, 내 목적에 맞게 데이터를 <strong>모델링(추상화)</strong> 해보세요!</p>
                    </header>

                    {/* Section 1: Original Data */}
                    <section className="mb-10 bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 className="font-bold text-slate-800 text-lg md:text-xl mb-4 text-blue-900 border-b-2 border-blue-900 inline-block pb-1">오늘의 급식 (중식)</h2>
                        
                        <div className="border border-gray-300 bg-white mb-4">
                            <table className="w-full text-left text-sm md:text-base border-collapse">
                                <thead>
                                    <tr className="bg-gray-100 text-gray-800 border-b border-gray-300 font-bold">
                                        <th className="p-3 border-r border-gray-300 w-1/2">메뉴</th>
                                        <th className="p-3 w-1/2">알레르기 번호</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {menuData.map(item => (
                                        <tr key={item.id} className="border-b border-gray-200 last:border-b-0">
                                            <td className="p-3 border-r border-gray-300">{item.name}</td>
                                            <td className="p-3 text-orange-600 font-medium">{item.allergy}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        <div className="text-sm md:text-base text-slate-800 mb-4 tracking-wide">
                            <span className="font-bold">열량 812 kcal</span> · 단백질 32 g · 칼슘 410 mg
                        </div>
                        <div className="text-xs md:text-sm text-slate-500 leading-relaxed tracking-tight break-keep">
                            원산지: 쇠고기(국내산), 돼지고기(국내산), 배추(국내산) · 영양사 김○○<br/>
                            알레르기 번호: 1 난류 · 2 우유 · 3 메밀 · 4 땅콩 · 5 대두 · 6 밀 · 7 고등어 · 8 게 · 9 새우 · 10 돼지고기 · 11 복숭아 · 12 토마토 · 13 아황산류 · 14 호두 · 15 닭고기 · 16 쇠고기 · 17 오징어 · 18 조개류 · 19 잣
                        </div>
                    </section>

                    <div className="grid md:grid-cols-2 gap-6 mb-8">
                        {/* Section 2: Situation Selection */}
                        <section className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                            <h3 className="font-bold text-lg mb-4 text-slate-800">1️⃣ 어떤 상황인가요?</h3>
                            <div className="space-y-3">
                                <label className="block relative cursor-pointer group">
                                    <input type="radio" name="situation" className="peer sr-only" 
                                        onChange={() => setSituation('allergy')} />
                                    <div className="p-4 border-2 border-slate-200 rounded-xl transition-all group-hover:border-blue-300 peer-checked:border-blue-500 peer-checked:bg-blue-50">
                                        <span className="font-bold text-slate-800 block mb-1 text-lg">🥚 계란 알레르기가 있는 친구</span>
                                        <span className="text-sm text-slate-600 block break-keep">"오늘 메뉴 중에 내가 먹으면 위험한 음식이 있는지 빨리 확인해야 해!"</span>
                                    </div>
                                </label>
                                <label className="block relative cursor-pointer group">
                                    <input type="radio" name="situation" className="peer sr-only" 
                                        onChange={() => setSituation('bulkup')} />
                                    <div className="p-4 border-2 border-slate-200 rounded-xl transition-all group-hover:border-blue-300 peer-checked:border-blue-500 peer-checked:bg-blue-50">
                                        <span className="font-bold text-slate-800 block mb-1 text-lg">💪 헬스를 하는 친구</span>
                                        <span className="text-sm text-slate-600 block break-keep">"득근을 위해 오늘 섭취할 영양 성분이 충분한지 식단을 계산해야 해!"</span>
                                    </div>
                                </label>
                            </div>
                        </section>

                        {/* Section 3: Attribute Selection */}
                        <section className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                            <h3 className="font-bold text-lg mb-2 text-slate-800">2️⃣ 속성 선택 (데이터 모델링)</h3>
                            <p className="text-sm text-slate-500 mb-4 break-keep">선택한 상황에 꼭 필요한 데이터 속성만 체크하여 나만의 표를 구성해보세요!</p>
                            <div className="flex flex-wrap gap-2">
                                {attributes.map(attr => (
                                    <label key={attr.id} className={`relative cursor-pointer ${attr.required ? 'cursor-not-allowed opacity-70' : ''}`}>
                                        <input 
                                            type="checkbox" 
                                            className="peer sr-only"
                                            checked={selectedAttrs.includes(attr.id)}
                                            onChange={() => toggleAttribute(attr.id)}
                                            disabled={attr.required}
                                        />
                                        <div className="px-4 py-2 border-2 border-slate-200 rounded-full font-medium transition-all select-none text-sm md:text-base peer-checked:border-indigo-500 peer-checked:bg-indigo-50 peer-checked:text-indigo-800 hover:bg-slate-50">
                                            {attr.label}
                                        </div>
                                    </label>
                                ))}
                            </div>
                        </section>
                    </div>

                    <div className="text-center mb-10">
                        <button 
                            onClick={applyModeling}
                            className="bg-indigo-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-indigo-700 hover:-translate-y-1 active:translate-y-0 transition-all text-lg w-full md:w-auto flex items-center justify-center mx-auto gap-2"
                        >
                            <span>💡</span> 나만의 급식표 만들기 (모델링 완료)
                        </button>
                    </div>

                    {/* Section 4: Result */}
                    {result && (
                        <div className="fade-in">
                            <div className={`p-4 md:p-6 mb-6 rounded-2xl border ${
                                result.feedback.type === 'success' ? 'bg-green-50 border-green-200 text-green-900' :
                                result.feedback.type === 'warning' ? 'bg-yellow-50 border-yellow-200 text-yellow-900' :
                                'bg-red-50 border-red-200 text-red-900'
                            }`}>
                                <h3 className="font-bold text-lg md:text-xl mb-2">{result.feedback.title}</h3>
                                <p className="text-sm md:text-base leading-relaxed break-keep">{result.feedback.message}</p>
                            </div>

                            {/* 생성된 모델링 표 표시 (에러가 아닐 때만 보여줌) */}
                            {result.feedback.type !== 'error' && (
                                <section className="bg-white rounded-2xl shadow-md border border-indigo-200 overflow-hidden fade-in">
                                    <div className="bg-indigo-50 px-5 py-4 border-b border-indigo-100 flex flex-col md:flex-row md:justify-between md:items-center gap-2">
                                        <h2 className="font-bold text-indigo-900 text-lg">✨ 모델링 결과 (새로운 데이터 표)</h2>
                                        <span className="text-xs bg-indigo-200 text-indigo-800 px-3 py-1.5 rounded-full font-semibold w-max">추출된 속성: {result.attributes.length}개</span>
                                    </div>
                                    <div className="overflow-x-auto p-4 md:p-5">
                                        <table className="w-full text-left text-sm md:text-base border-collapse border border-slate-300">
                                            <thead>
                                                <tr className="bg-slate-100 text-slate-800 border-b border-slate-300">
                                                    {attributes.filter(a => result.attributes.includes(a.id)).map(attr => (
                                                        <th key={attr.id} className="p-3 border-r border-slate-300 last:border-r-0 font-bold">{attr.label}</th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {menuData.map((item, idx) => (
                                                    <tr key={item.id} className="border-b border-slate-200 last:border-b-0">
                                                        {attributes.filter(a => result.attributes.includes(a.id)).map(attr => (
                                                            <td key={attr.id} className={`p-3 border-r border-slate-300 last:border-r-0 ${attr.id === 'allergy' ? 'text-orange-600 font-medium' : 'text-slate-700'}`}>
                                                                {item[attr.id === 'menu' ? 'name' : attr.id]}
                                                            </td>
                                                        ))}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </section>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
